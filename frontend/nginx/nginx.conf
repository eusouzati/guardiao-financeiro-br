# Nginx sem privilégios (usuário nginx, porta 8080, arquivos temporários em /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Limite de corpo alinhado ao MAX_UPLOAD_SIZE_MB (+ margem); o backend também valida.
    client_max_body_size 12m;

    # Log sem query string (pode conter dados) e com correlation ID.
    log_format json_log escape=json '{"time":"$time_iso8601","status":$status,'
        '"method":"$request_method","path":"$uri","request_id":"$request_id",'
        '"duration_s":$request_time}';
    access_log /dev/stdout json_log;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            # Resolução dinâmica: o IP do backend muda quando o container é recriado.
            # resolver.conf (DNS do /etc/resolv.conf) e api-upstream.conf (BACKEND_UPSTREAM)
            # são gerados na inicialização por nginx/docker-entrypoint.d/ e templates/.
            include /tmp/nginx/resolver.conf;
            include /tmp/nginx/api-upstream.conf;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
