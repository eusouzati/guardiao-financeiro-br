[project]
name = "guardiao-financeiro-br-backend"
version = "0.1.0.dev1"
description = "Backend do Guardião Financeiro BR — conferência inteligente de contas a pagar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# Cada dependência tem função registrada em docs/dependencies.md (ADR-020).
dependencies = [
    "alembic==1.20.0",           # migrations
    "fastapi==0.141.1",          # API HTTP + OpenAPI
    "psycopg[binary]==3.3.6",    # driver PostgreSQL
    "pydantic==2.13.5",          # validação/serialização
    "pydantic-settings==2.15.0", # configuração por variáveis de ambiente
    "sqlalchemy==2.1.1",         # ORM / acesso a dados
    "uvicorn==0.54.0",           # servidor ASGI
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",  # cliente usado pelo TestClient do Starlette
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
# Aplicação, não biblioteca: não empacotar/instalar o projeto no venv.
package = false

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (segurança)
    "DTZ",      # datetimes sem timezone
    "T20",      # print
    "SIM",      # simplificações
    "RUF",      # regras do ruff
    "N",        # nomes
    "C4",       # comprehensions
    "PT",       # estilo pytest
    "TID",      # imports proibidos
    "PL",       # pylint (subset)
]
ignore = [
    "PLR0913",  # muitas funções de domínio têm vários parâmetros nomeados
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]  # assert e números mágicos são normais em testes
"migrations/versions/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"decimal.getcontext".msg = "Não altere o contexto global de Decimal; use app.domain.money (ADR-009)."

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "migrations"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: testes que dependem de PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
