# =============================================================
# Guardião Financeiro BR — Docker Compose (ambiente LOCAL)
#
# Sprint 0: somente PostgreSQL. Os serviços `backend` e `frontend`
# serão adicionados na Sprint 1 (ver PROJECT_PLAN.md).
#
# Uso:
#   cp .env.example .env      # ajuste POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose ps         # aguarde "healthy"
# =============================================================
name: guardiao-financeiro-br

services:
  db:
    # Versão alinhada ao Azure Database for PostgreSQL Flexible Server (ADR-002).
    # Na Sprint 9 a imagem será fixada por digest.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardiao}
      POSTGRES_USER: ${POSTGRES_USER:-guardiao}
      # Obrigatória: o compose falha se não estiver definida no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Publicado apenas na interface local da máquina.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+: o volume deve ser montado em /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
